[package]
name = "plush_memory_viewer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AppLoad windowed viewer that blits plush_memory's touch-memory collage onto the reMarkable Paper Pro e-ink panel, in staged partial-refresh frames."

[dependencies]
libc = "0.2"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
